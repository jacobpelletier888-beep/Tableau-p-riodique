<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chimie — Tableaux</title>
<style>
  :root{
    --bg:#0f172a;
    --bg2:#1e293b;
    --card:#ffffff;
    --ink:#0f172a;
    --muted:#64748b;
    --accent:#2563eb;
    --accent2:#7c3aed;
    --shadow:0 10px 30px rgba(2,6,23,.18);
    --radius:16px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,#0f172a 0%,#1e293b 45%,#334155 100%);
    min-height:100vh;
  }

  /* ---------- Vues ---------- */
  .view{display:none;min-height:100vh;}
  .view.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  /* ---------- Dashboard ---------- */
  #dashboard{
    display:none;
    align-items:center;
    justify-content:center;
    padding:24px;
    text-align:center;
  }
  #dashboard.active{display:flex;flex-direction:column;}
  .dash-header{margin-bottom:40px;}
  .dash-header h1{
    color:#fff;
    font-size:clamp(28px,5vw,44px);
    margin:0 0 10px;
    letter-spacing:.5px;
  }
  .dash-header p{color:#cbd5e1;margin:0;font-size:clamp(14px,2.5vw,18px);}

  .btn-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:22px;
    width:100%;
    max-width:420px;
  }
  @media(min-width:640px){.btn-grid{grid-template-columns:1fr 1fr;max-width:720px;}}

  .dash-btn{
    border:none;
    cursor:pointer;
    border-radius:var(--radius);
    padding:34px 22px;
    color:#fff;
    text-align:center;
    box-shadow:var(--shadow);
    transition:transform .15s ease,box-shadow .15s ease,filter .15s ease;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    font-size:18px;
    font-weight:600;
  }
  .dash-btn:hover{transform:translateY(-4px);filter:brightness(1.06);box-shadow:0 18px 40px rgba(2,6,23,.35);}
  .dash-btn:active{transform:translateY(-1px);}
  .dash-btn .icon{font-size:46px;line-height:1;}
  .dash-btn small{font-weight:400;opacity:.9;font-size:13px;}
  #btn-ions{background:linear-gradient(140deg,#7c3aed,#a855f7);}
  #btn-periodic{background:linear-gradient(140deg,#2563eb,#06b6d4);}

  /* ---------- Barre de retour ---------- */
  .topbar{
    position:sticky;
    top:0;
    z-index:20;
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 18px;
    background:rgba(15,23,42,.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:#fff;
    color:var(--ink);
    border:none;
    cursor:pointer;
    padding:9px 16px;
    border-radius:999px;
    font-size:15px;
    font-weight:600;
    box-shadow:var(--shadow);
    transition:transform .12s ease,filter .12s ease;
  }
  .back-btn:hover{transform:translateX(-2px);filter:brightness(.98);}
  .back-btn .arrow{font-size:18px;line-height:1;}
  .topbar h2{color:#fff;margin:0;font-size:clamp(16px,3vw,22px);font-weight:600;}

  .content{padding:20px;}

  /* ---------- Tableau périodique ---------- */
  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:8px 14px;
    margin:0 auto 18px;
    max-width:1200px;
    justify-content:center;
  }
  .legend span{
    display:inline-flex;
    align-items:center;
    gap:6px;
    color:#e2e8f0;
    font-size:12px;
  }
  .legend i{width:13px;height:13px;border-radius:3px;display:inline-block;}

  .table-scroll{overflow-x:auto;padding-bottom:12px;}
  .ptable{
    display:grid;
    grid-template-columns:repeat(18,minmax(34px,1fr));
    grid-auto-rows:minmax(34px,auto);
    gap:4px;
    max-width:1250px;
    margin:0 auto;
    min-width:760px;
  }
  .cell{
    position:relative;
    border-radius:6px;
    padding:3px;
    aspect-ratio:1/1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    color:#0f172a;
    transition:transform .1s ease,box-shadow .1s ease;
    user-select:none;
    overflow:hidden;
  }
  .cell:hover{transform:scale(1.12);z-index:5;box-shadow:0 6px 16px rgba(0,0,0,.35);}
  .cell .num{position:absolute;top:2px;left:4px;font-size:9px;opacity:.75;}
  .cell .sym{font-size:clamp(11px,1.6vw,17px);font-weight:700;line-height:1;}
  .cell .mass{font-size:8px;opacity:.7;margin-top:1px;}
  .cell .name{font-size:7px;opacity:.75;line-height:1;text-align:center;margin-top:1px;display:none;}
  @media(min-width:900px){.cell .name{display:block;}}

  .ph{background:transparent!important;cursor:default;box-shadow:none!important;}
  .ph:hover{transform:none;}
  .marker{
    grid-column:3/18;
    background:transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#94a3b8;
    font-size:11px;
    font-style:italic;
    aspect-ratio:auto;
  }

  /* Catégories */
  .c-al{background:#fca5a5;}
  .c-ae{background:#fdba74;}
  .c-tm{background:#fde68a;}
  .c-pm{background:#bef264;}
  .c-ml{background:#6ee7b7;}
  .c-nm{background:#5eead4;}
  .c-hl{background:#67e8f9;}
  .c-ng{background:#a5b4fc;}
  .c-ln{background:#f9a8d4;}
  .c-ac{background:#d8b4fe;}

  /* ---------- Fiche élément (modal) ---------- */
  .modal{
    position:fixed;inset:0;z-index:50;
    display:none;
    align-items:center;justify-content:center;
    background:rgba(2,6,23,.6);
    padding:20px;
  }
  .modal.open{display:flex;animation:fade .2s ease;}
  .modal-card{
    background:#fff;border-radius:18px;
    padding:26px;max-width:340px;width:100%;
    text-align:center;box-shadow:var(--shadow);position:relative;
  }
  .modal-card .close{
    position:absolute;top:12px;right:14px;
    border:none;background:#f1f5f9;border-radius:50%;
    width:30px;height:30px;cursor:pointer;font-size:16px;color:#334155;
  }
  .modal-sym{font-size:52px;font-weight:800;margin:4px 0;}
  .modal-num{color:var(--muted);font-size:14px;}
  .modal-name{font-size:22px;font-weight:700;margin:6px 0 2px;}
  .modal-rows{margin-top:16px;text-align:left;font-size:14px;}
  .modal-rows div{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid #eef2f7;}
  .modal-rows span:first-child{color:var(--muted);}

  /* ---------- Ions polyatomiques ---------- */
  .ions-wrap{max-width:1050px;margin:0 auto;}
  .ions-intro{color:#cbd5e1;text-align:center;margin:0 auto 18px;max-width:640px;font-size:15px;}

  .ion-controls{margin-bottom:14px;}
  .search-box{position:relative;max-width:480px;margin:0 auto 14px;}
  .search-box input{
    width:100%;
    padding:13px 42px 13px 42px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.96);
    font-size:15px;color:var(--ink);
    outline:none;box-shadow:var(--shadow);
  }
  .search-box input:focus{border-color:var(--accent);}
  .search-box .ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.5;}
  .search-box .clear{
    position:absolute;right:12px;top:50%;transform:translateY(-50%);
    border:none;background:#e2e8f0;color:#334155;border-radius:50%;
    width:24px;height:24px;cursor:pointer;font-size:12px;display:none;line-height:1;
  }
  .search-box .clear.show{display:block;}

  .filter-mode{display:flex;justify-content:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .filter-mode button{
    border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.08);
    color:#e2e8f0;padding:7px 16px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;
    transition:background .12s ease,border-color .12s ease;
  }
  .filter-mode button.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  .letter-bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
  .letter-bar button{
    min-width:34px;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.06);
    color:#cbd5e1;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;
    transition:background .12s ease,color .12s ease,border-color .12s ease;
  }
  .letter-bar button:hover{background:rgba(255,255,255,.16);}
  .letter-bar button.active{background:#fff;color:var(--ink);border-color:#fff;}

  .ion-count{text-align:center;color:#94a3b8;font-size:13px;margin:16px 0 12px;}

  .ion-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:12px;
  }
  .ion-card{
    background:#fff;border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);
  }
  .ion-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .ion-card .formula{font-size:20px;font-weight:700;color:var(--ink);line-height:1.2;}
  .ion-card .formula sub{font-size:12px;}
  .ion-card .formula sup{font-size:12px;color:var(--accent2);}
  .ion-card .ion-name{color:var(--muted);font-size:14px;margin-top:4px;}
  .charge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;color:#0f172a;}
  .charge-pos{background:#fca5a5;}
  .charge-neg{background:#7dd3fc;}

  .ion-empty{text-align:center;color:#94a3b8;font-size:15px;padding:30px 10px;display:none;}
  .ion-empty.show{display:block;}

  footer{text-align:center;color:#64748b;font-size:12px;padding:24px;}
</style>
</head>
<body>

<!-- ============ DASHBOARD ============ -->
<section id="dashboard" class="view active">
  <div class="dash-header">
    <h1>⚗️ Chimie</h1>
    <p>Choisis un tableau à consulter</p>
  </div>
  <div class="btn-grid">
    <button id="btn-ions" class="dash-btn" onclick="show('ions')">
      <span class="icon">🧪</span>
      Ions polyatomiques
      <small>Cations et anions à retenir</small>
    </button>
    <button id="btn-periodic" class="dash-btn" onclick="show('periodic')">
      <span class="icon">🔬</span>
      Tableau périodique
      <small>Les 118 éléments</small>
    </button>
  </div>
</section>

<!-- ============ IONS POLYATOMIQUES ============ -->
<section id="ions" class="view">
  <div class="topbar">
    <button class="back-btn" onclick="show('dashboard')">
      <span class="arrow">←</span> Retour
    </button>
    <h2>Ions polyatomiques</h2>
  </div>
  <div class="content">
    <div class="ions-wrap">
      <p class="ions-intro">Recherche un ion par son nom ou son symbole, ou filtre par première lettre.</p>
      <div class="ion-controls">
        <div class="search-box">
          <span class="ico">🔍</span>
          <input id="ion-search" type="text" placeholder="Rechercher : nom ou symbole…" autocomplete="off">
          <button class="clear" id="ion-clear" aria-label="Effacer la recherche">✕</button>
        </div>
        <div class="filter-mode">
          <button data-mode="sym" class="active">Filtrer par symbole</button>
          <button data-mode="name">Filtrer par nom</button>
        </div>
        <div class="letter-bar" id="letter-bar"></div>
      </div>
      <div class="ion-count" id="ion-count"></div>
      <div class="ion-grid" id="ions-content"></div>
      <p class="ion-empty" id="ion-empty">Aucun ion ne correspond à ta recherche.</p>
    </div>
  </div>
</section>

<!-- ============ TABLEAU PÉRIODIQUE ============ -->
<section id="periodic" class="view">
  <div class="topbar">
    <button class="back-btn" onclick="show('dashboard')">
      <span class="arrow">←</span> Retour
    </button>
    <h2>Tableau périodique</h2>
  </div>
  <div class="content">
    <div class="legend" id="legend"></div>
    <div class="table-scroll">
      <div class="ptable" id="ptable"></div>
    </div>
    <footer>Touche un élément pour voir sa fiche.</footer>
  </div>
</section>

<!-- ============ FICHE ÉLÉMENT ============ -->
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-card">
    <button class="close" onclick="closeModal()">✕</button>
    <div class="modal-num" id="m-num"></div>
    <div class="modal-sym" id="m-sym"></div>
    <div class="modal-name" id="m-name"></div>
    <div class="modal-rows">
      <div><span>Numéro atomique</span><span id="m-z"></span></div>
      <div><span>Masse atomique</span><span id="m-mass"></span></div>
      <div><span>Catégorie</span><span id="m-cat"></span></div>
      <div><span>Période</span><span id="m-period"></span></div>
      <div><span>Groupe</span><span id="m-group"></span></div>
    </div>
  </div>
</div>

  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

/* -------- Construction du tableau périodique -------- */
function buildPeriodic(){
  const grid = document.getElementById('ptable');
  const byPos = {};
  ELEMENTS.forEach(e=>byPos[e[6]+'-'+e[5]] = e);

  // On parcourt les rangées 1 à 10 (7 = fin main, 9 = lanth., 10 = actin.)
  for(let row=1; row<=10; row++){
    if(row===8){
      // ligne vide de séparation + marqueurs
      const spacer = document.createElement('div');
      spacer.style.gridColumn='1/19';
      spacer.style.height='8px';
      grid.appendChild(spacer);
      continue;
    }
    for(let col=1; col<=18; col++){
      const el = byPos[row+'-'+col];
      if(el){
        grid.appendChild(makeCell(el));
      } else {
        // placeholder pour garder l'alignement
        const ph = document.createElement('div');
        ph.className='cell ph';
        ph.style.gridColumn=col;
        ph.style.gridRow=row;
        grid.appendChild(ph);
      }
    }
  }
}

function makeCell(e){
  const [z,sym,name,mass,cat,col,row] = e;
  const cell = document.createElement('div');
  cell.className='cell c-'+cat;
  cell.style.gridColumn=col;
  cell.style.gridRow=row;
  cell.innerHTML =
    '<span class="num">'+z+'</span>'+
    '<span class="sym">'+sym+'</span>'+
    '<span class="mass">'+mass+'</span>'+
    '<span class="name">'+name+'</span>';
  cell.addEventListener('click',()=>openModal(e));
  return cell;
}

/* -------- Légende -------- */
function buildLegend(){
  const l = document.getElementById('legend');
  Object.keys(CATEGORIES).forEach(k=>{
    const s = document.createElement('span');
    s.innerHTML = '<i class="c-'+k+'"></i>'+CATEGORIES[k];
    l.appendChild(s);
  });
}

/* -------- Fiche élément -------- */
function periodOf(e){
  const row = e[6];
  if(e[4]==='ln') return 6;
  if(e[4]==='ac') return 7;
  return row;
}
function groupOf(e){
  if(e[4]==='ln'||e[4]==='ac') return '—';
  return e[5];
}
function openModal(e){
  const [z,sym,name,mass,cat] = e;
  document.getElementById('m-num').textContent = 'Élément n° '+z;
  document.getElementById('m-sym').textContent = sym;
  document.getElementById('m-sym').className = 'modal-sym';
  document.getElementById('m-name').textContent = name;
  document.getElementById('m-z').textContent = z;
  document.getElementById('m-mass').textContent = mass+' u';
  document.getElementById('m-cat').textContent = CATEGORIES[cat];
  document.getElementById('m-period').textContent = periodOf(e);
  document.getElementById('m-group').textContent = groupOf(e);
  document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open');}
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeModal();});

/* -------- Ions polyatomiques -------- */

  {f:'CrO<sub>4</sub><sup>2−</sup>', sym:'CrO4', n:'Chromate', c:'2−'},

/* État courant des filtres */
let ionState = { q:'', mode:'sym', letter:null };

/* Enlève les accents et met en minuscules pour une recherche souple */
function norm(s){ return s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }

/* Première lettre selon le mode choisi (symbole ou nom) */
function firstLetter(ion){
  return (ionState.mode==='sym' ? ion.sym : norm(ion.n)).charAt(0).toUpperCase();
}

/* Construit la barre de lettres (A, B, C…) selon le mode actif */
function buildLetterBar(){
  const bar = document.getElementById('letter-bar');
  const letters = [...new Set(IONS.map(firstLetter))].sort();
  let html = '<button class="'+(ionState.letter===null?'active':'')+'" data-letter="">Tous</button>';
  letters.forEach(L=>{
    html += '<button class="'+(ionState.letter===L?'active':'')+'" data-letter="'+L+'">'+L+'</button>';
  });
  bar.innerHTML = html;
  bar.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click',()=>{
      const L = b.getAttribute('data-letter');
      ionState.letter = (L==='' ? null : L);
      buildLetterBar();
      renderIons();
    });
  });
}

/* Affiche les cartes selon la recherche + la lettre sélectionnée */
function renderIons(){
  const wrap = document.getElementById('ions-content');
  const q = norm(ionState.q.trim());
  const list = IONS.filter(ion=>{
    const okLetter = (ionState.letter===null) || (firstLetter(ion)===ionState.letter);
    const okSearch = (q==='') || norm(ion.n).includes(q) || norm(ion.sym).includes(q);
    return okLetter && okSearch;
  });
  wrap.innerHTML = list.map(ion=>{
    const cls = ion.c.includes('+') ? 'charge-pos' : 'charge-neg';
    return '<div class="ion-card"><div class="ion-top"><span class="formula">'+ion.f+
      '</span><span class="charge '+cls+'">'+ion.c+'</span></div>'+
      '<div class="ion-name">'+ion.n+'</div></div>';
  }).join('');
  document.getElementById('ion-empty').classList.toggle('show', list.length===0);
  document.getElementById('ion-count').textContent =
    list.length + (list.length>1?' ions affichés':' ion affiché') + ' sur ' + IONS.length;
}

/* Branche la recherche, le bouton d'effacement et les modes de filtre */
function initIons(){
  buildLetterBar();
  renderIons();
  const search = document.getElementById('ion-search');
  const clear = document.getElementById('ion-clear');
  search.addEventListener('input',()=>{
    ionState.q = search.value;
    clear.classList.toggle('show', search.value.length>0);
    renderIons();
  });
  clear.addEventListener('click',()=>{
    search.value=''; ionState.q=''; clear.classList.remove('show'); renderIons(); search.focus();
  });
  document.querySelectorAll('.filter-mode button').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('.filter-mode button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      ionState.mode = b.getAttribute('data-mode');
      ionState.letter = null; /* on repart de « Tous » quand on change de mode */
      buildLetterBar();
      renderIons();
    });
  });
}

/* -------- Init -------- */
buildPeriodic();
buildLegend();
initIons();
</script>
